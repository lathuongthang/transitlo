<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ASEAN EXPO — TRANSITLO</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="miniweb-assets/gallery.css?v=20260813-1815" />
  
<style id="transitlo-charcoal-palette">
/* 2026-08-18 palette-only test: Charcoal 70% / Slate 20% / Ash+Silver 8% / Copper 2% */
:root{--charcoal:#20262b;--charcoal-2:#262e34;--slate:#3d4850;--slate-2:#46525a;--stone:#777d80;--ash:#c3c7c9;--silver:#e4e6e7;--copper:#b88963}
html,body{background:linear-gradient(180deg,#20262b 0%,#252d33 100%)!important;color:var(--silver)!important}
.wrap{color:var(--silver)!important}
.top{border-bottom-color:rgba(228,230,231,.12)!important}
.brand,.home{color:var(--ash)!important}.brand:hover,.home:hover{color:var(--copper)!important}
.hero{border-color:rgba(228,230,231,.12)!important}.eyebrow,.note{color:var(--stone)!important}.hero h1,.cn{color:var(--silver)!important}
.project{color:var(--silver)!important;background:linear-gradient(180deg,#46525a 0%,#3d4850 100%)!important;border-color:rgba(228,230,231,.12)!important;box-shadow:-8px -8px 18px rgba(255,255,255,.055),12px 15px 25px rgba(0,0,0,.38),0 7px 0 rgba(24,29,33,.82),0 17px 24px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.34)!important}
.project:hover,.project:focus-visible{box-shadow:-9px -9px 20px rgba(255,255,255,.055),15px 18px 28px rgba(0,0,0,.42),0 0 0 1px rgba(228,230,231,.14),0 0 0 4px rgba(184,137,99,.28),0 0 28px rgba(184,137,99,.24)!important}
.thumb{background:#303940!important}.meta{color:var(--ash)!important;border-top-color:rgba(228,230,231,.10)!important}.meta b{color:var(--silver)!important}.meta span{color:var(--stone)!important}
.viewer{background:rgba(20,24,27,.97)!important;color:var(--silver)!important}.viewer-top,.viewer-bottom{background:#20262b!important;border-color:rgba(228,230,231,.12)!important}.viewer-title,.zoomtxt{color:var(--ash)!important}
.round,.full{color:var(--silver)!important;background:linear-gradient(180deg,#46525a 0%,#3d4850 100%)!important;border-color:rgba(228,230,231,.12)!important;box-shadow:-4px -4px 10px rgba(255,255,255,.045),6px 8px 12px rgba(0,0,0,.34)!important}.round:hover,.full:hover{color:var(--copper)!important}
.viewer-scroll{background:#171b1e!important}
.choice a{color:var(--silver)!important;border-color:rgba(228,230,231,.12)!important;background:linear-gradient(180deg,#46525a 0%,#3d4850 100%)!important;box-shadow:-8px -8px 18px rgba(255,255,255,.055),12px 15px 24px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.34)!important}
.choice a:before{color:var(--stone)!important}.choice a:after{color:var(--ash)!important;border-color:rgba(228,230,231,.12)!important;background:linear-gradient(180deg,#46525a 0%,#3d4850 100%)!important;box-shadow:-4px -4px 9px rgba(255,255,255,.045),6px 7px 11px rgba(0,0,0,.32)!important}.choice a:hover{box-shadow:-9px -9px 20px rgba(255,255,255,.055),15px 18px 28px rgba(0,0,0,.42),0 0 0 3px rgba(184,137,99,.28)!important}.choice span{color:var(--ash)!important}
</style>
</head>
  <body>
    <main class="wrap">
      <header class="top">
        <a class="brand" href="index.html">TRANSITLO</a
        ><a class="home" href="miniweb-exhibition.html">← EXHIBITION</a>
      </header>
      <section class="hero">
        <div class="eyebrow">02 / CAEXPO · VIETNAM PAVILION</div>
        <h1>ASEAN EXPO</h1>
        <div class="cn">中国—东盟博览会 · 越南馆</div>
        <div class="note">
          四个独立展示空间：国防经济产品、VIETRADE、广宁省、TH true MILK。
        </div>
      </section>
      <section class="grid">
        <button
          class="project"
          data-id="defense"
          data-title="VIETNAM DEFENSE ECONOMIC PRODUCTS EXHIBITION AREA"
          data-shot="miniweb-assets/previews/defense.webp"
          data-path="defense.html"
        >
          <div class="thumb">
            <img
              src="miniweb-assets/gallery-thumbs/defense.webp"
              alt="Vietnam Defense Economic Products"
              loading="eager"
            />
          </div>
          <div class="meta">
            <b>VIETNAM DEFENSE ECONOMIC PRODUCTS</b><span>01</span>
          </div></button
        ><button
          class="project"
          data-id="viettrade"
          data-title="VIETRADE PAVILION"
          data-shot="miniweb-assets/previews/viettrade.webp"
          data-path="viettrade.html"
        >
          <div class="thumb">
            <img
              src="miniweb-assets/gallery-thumbs/viettrade.webp"
              alt="VIETRADE Pavilion"
              loading="eager"
            />
          </div>
          <div class="meta">
            <b>VIETRADE PAVILION</b><span>02</span>
          </div></button
        ><button
          class="project"
          data-id="quangninh"
          data-title="QUANG NINH PROVINCE PAVILION"
          data-shot="miniweb-assets/previews/quangninh.webp"
          data-path="quangninh.html"
        >
          <div class="thumb">
            <img
              src="miniweb-assets/gallery-thumbs/quangninh.webp"
              alt="Quang Ninh Province Pavilion"
              loading="eager"
            />
          </div>
          <div class="meta">
            <b>QUANG NINH PROVINCE PAVILION</b><span>03</span>
          </div></button
        ><button
          class="project"
          data-id="thtruemilk"
          data-title="TH TRUE MILK PAVILION"
          data-shot="miniweb-assets/previews/thtruemilk.webp"
          data-path="thtruemilk.html"
        >
          <div class="thumb">
            <img
              src="miniweb-assets/gallery-thumbs/thtruemilk.webp"
              alt="TH true MILK Pavilion"
              loading="eager"
            />
          </div>
          <div class="meta"><b>TH TRUE MILK PAVILION</b><span>04</span></div>
        </button>
      </section>
    </main>
    <section class="viewer" id="viewer">
      <div class="viewer-top">
        <div class="viewer-title" id="viewerTitle"></div>
        <div class="viewer-tools">
          <button class="round" id="zoomOut">−</button
          ><span class="zoomtxt" id="zoomTxt">100%</span
          ><button class="round" id="zoomIn">+</button
          ><button class="round" id="closeViewer">×</button>
        </div>
      </div>
      <div class="viewer-scroll" id="viewerScroll">
        <img id="viewerImg" alt="Full page preview" />
      </div>
      <div class="viewer-bottom">
        <button class="full" id="fullPage">View Full Page ↗</button>
      </div>
    </section>
    <script src="miniweb-assets/gallery.js?v=20260813-1815"></script>
  </body>
</html>
