.top{border-bottom-color:rgba(228,230,231,.12)!important}
.brand,.home{color:var(--ash)!important}.brand:hover,.home:hover{color:var(--copper)!important}

.round,.full{color:var(--silver)!important;background:linear-gradient(180deg,#46525a 0%,#3d4850 100%)!important;border-color:rgba(228,230,231,.12)!important;box-shadow:-4px -4px 10px rgba(255,255,255,.045),6px 8px 12px rgba(0,0,0,.34)!important}.round:hover,.full:hover{color:var(--copper)!important}
.viewer-scroll{background:#171b1e!important}
